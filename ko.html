const SONS=[
 {k:'壹',dragon:'수우',name:'안청징',rank:'첫째',gift:'어음',c:'#3f8f84',img:'F01',por:'371b454a-23ca-443e-9b7d-fa2d29fcc753?v=adf7ff',line:'큰형은 세 블록 떨어진 곳에서 누가 음정 틀리는 것도 들어요.',
  form:'짧은 뿔에 목덜미를 따라 섬세한 감음린이 돋은, 짙은 청록빛의 긴 몸을 가진 용수.',len:'약 8–12m',pow:'어음(御音)·청식(聽息). 음악으로 혼을 가라앉히고 결계를 이루며, 아주 작은 소리로 생명의 기척을 가려낸다.',lim:'들끓는 것을 가라앉힐 수는 있어도, 음악으로 의지를 영원히 묶어 둘 수는 없다.',off:'함께 합주하기, 맑은 향 한 줄.',
  led:['축명가의 용명 한 번에 고금 하나가 부서져 동원에서 둘이 한바탕 싸웠다. 지금 금실의 방음벽은 그 싸움 뒤에 세운 것이다.','잠귀수가 산에서 가져온 나무로 풍경을 몇 개 만들어 여러 봉우리에 걸어 두었다. 잠귀수는 아직도 다 떼지 않았다.','음치였던 어느 대의 종주가 정월대보름마다 함께 합주하자고 고집했다. 그는 삼십일 년 동안 함께했고, 한 번도 자리를 뜨지 않았다.'],note:['축명가','#c9637f','큰형은 본모습일 때 귀가 더 까다로워.']},
 {k:'貳',dragon:'애자',name:'곽무구',rank:'둘째',gift:'병살',c:'#a8322a',img:'F02',por:'6ae2e121-f3e1-4869-a72c-1ab0cf005d81?v=869b97',line:'둘째 형 등의 비늘은 칼날이에요. 이기려고 싸우는 게 아니라, 한 판 더 하려고 싸우죠.',
  form:'붉은 눈과 날카로운 이빨, 등에 칼날 같은 비늘 능선이 솟은 늑대 형상의 용수.',len:'약 6–9m',pow:'병살(兵煞)·어인(御刃). 전의가 거셀수록 용위도 강해진다.',lim:'칼날을 다룬다고 해서 모든 적을 한 번에 쓰러뜨릴 수 있는 것은 아니다.',off:'한 판 대련, 그의 경기 관람.',
  led:['옛 전쟁에서 백회석과 서로 목숨을 구해 준 적이 있다. 둘 다 입에 올리지 않는다.','고소형과는 여러 번 싸웠다. 가장 최근엔 주차 자리 때문이었다.','나계명의 체육관이 문을 연 해, 그는 관원 전원을 이기고 나계명에게 한 달 동안 바닥 청소 벌을 받았다. 정말로 했다.'],note:['백회석','#5e9c90','……본모습일 때 소파를 물어.']},
 {k:'參',dragon:'조풍',name:'잠귀수',rank:'셋째',gift:'어풍',c:'#8f6a3c',img:'F03',por:'1970d6c7-7d5c-4eae-882e-5b4675e785ac?v=13a047',line:'셋째 형은 바람길에 살아요. 재앙이 오는 건 보이지만, 꼭 말해 주지는 않아요.',
  form:'갈색 뿔과 갈고리 발톱, 등에 바람을 타는 비늘막이 있는 늘씬한 벼랑의 용.',len:'약 7–10m',pow:'어풍(御風)·망기(望氣). 높은 곳에서 재앙의 징조를 알아차린다.',lim:'징조는 알아차려도 모든 미래를 볼 수는 없다.',off:'높은 곳에서 함께 해돋이 보기, 조용히 앉아 있기.',
  led:['산귀 응청라와는 아주 오래 알고 지냈다. 수십 년 만에 만나도 여전히 서로를 깎아내린다.','진안이 설치한 스마트 도어락이 사흘 만에 일곱 번 고장 났다. 그는 인정도 부정도 하지 않았다.','한 번은 나가서 사십 년 동안 소식이 없었다. 돌아와서는 고산차 한 봉지를 들고 다들 밥은 먹었냐고 물었다.'],note:['안청징','#3f8f84','풍경은 그대로 둬도 돼. 마지막 줄은 안 써도 됐고.']},
 {k:'肆',dragon:'포뢰',name:'축명가',rank:'넷째',gift:'용명',c:'#c9637f',img:'F04',por:'8ee3264b-99b1-439a-a3fa-fdcbdd563c93?v=fb1589',line:'넷째 형이 입을 열면 결계도 못 막고, 유리창도 못 막아요.',
  form:'검은 꼬리에 분홍 비늘, 가슴과 목이 발달한 단단한 체구의 용수.',len:'약 5–7m',pow:'용명(龍鳴)·진혼(震魂). 목소리가 결계를 꿰뚫고 사물을 부수며 아주 멀리까지 닿는다.',lim:'위력은 엄청나지만, 정밀하게 다루려면 일부러 힘을 죽여야 한다.',off:'신제품 함께 테스트하기, 늦게까지 같이 놀기.',
  led:['은조야와 함께 임시 행궁의 절반을 태운 적이 있다. 이후 종문은 둘이 허락 없이 대형 불꽃놀이를 함께 기획하는 것을 금했다.','젊은 시절의 셋째 종조부에게 혼난 적이 있는데, 종조부는 그 설 내내 장난에 시달렸다.','백회석은 그의 장난감 내구성 테스터다. 기록: 장난감 0승.'],note:['은조야','#b02a37','그 행궁 원래 못생겼어.']},
 {k:'伍',dragon:'산예',name:'양현도',rank:'다섯째',gift:'어연',c:'#7a6230',img:'F05',por:'dc3c7b51-2a16-4862-bb93-bb69f4fe18ef?v=12622b',line:'다섯째 형이 내뿜는 연기는 사기를 막고, 산 하나를 통째로 숨기기도 해요.',
  form:'검고 금빛 도는 갈기를 지닌 묵직한 사자 형상의 용수. 입과 코로 향연을 내뿜는다.',len:'약 9–13m',pow:'어연(御煙)·진사(鎮邪). 연기로 사기를 쫓고 자취를 감추며 영장을 안정시킨다.',lim:'연기로 사기를 누를 수는 있어도 모든 생명을 조종할 수는 없다.',off:'함께 식사하기, 향실에서 향 피우기.',
  led:['족숙 지겸이 놀고 있는 땅을 팔자고 하자, 그를 불러 네 시간 동안 차를 마셨다. 지겸은 제안을 철회했고 지금도 이유를 말하지 않는다.','은조야가 초기에 벌인 사업은 그의 자금과 인맥으로 굴러갔다. 둘 다 그 얘기는 하지 않는다.','주방 찻잎을 바꾼 일로 광미련과 다툰 적이 있다. 광미련이 이겼다.'],note:['용관복','#cf8233','다섯째 형네 밥이 홍콩에서 제일 맛있어. 이 문장은 저녁값이야.']},
 {k:'陸',dragon:'비희',name:'백회석',rank:'여섯째',gift:'부산',c:'#5e9c90',img:'F06',por:'56b6bc56-fa5e-4ce7-9e11-ddc8ac3b0e51?v=d6027e',line:'여섯째 형은 몸을 줄여도 삼십 미터가 넘어요. 예전엔 산을 졌고, 요즘은 가구를 져요.',
  form:'용의 머리에 두꺼운 갑주, 굵직한 네 다리를 지닌 거대한 거북 형상의 용수. 사람 모습일 때는 비늘 무늬가 일본 전통 문신처럼 피부에 펼쳐져 있다.',len:'약 18–35m',pow:'부산(負山)·진지(鎮地). 지맥을 단단히 붙들며, 그 갑각은 깨지지 않는다.',lim:'지맥을 누를 수는 있어도, 갈라지는 모든 땅을 대가 없이 한꺼번에 짊어질 수는 없다.',off:'함께 햇볕 쬐기, 조용한 식사 한 끼.',
  led:['둘째 고모할머니는 어릴 때 그의 어깨에 올라탄 적이 있다. 칠십 년이 지나도 얼굴이 그대로인 그에게 여전히 묻는다. 「회석아, 오늘 밥은 먹었니?」','형제가 이사할 때 제일 먼저 떠올리는 게 그다.','육백 년 전 돌사자 정령 석이는 그를 처음 보고 산인 줄 알아 세 번 절했다.'],note:['백회석','#5e9c90','……먹었어.']},
 {k:'柒',dragon:'폐안',name:'고소형',rank:'일곱째',gift:'명변',c:'#2f5079',img:'F07',por:'b2b09c64-9dcf-4141-8638-8b95c8884d6e?v=fbe37a',line:'일곱째 형은 맹세가 진짜인지 가짜인지 가려내요. 사람 속은 못 읽으니까, 계속 물어보죠.',
  form:'짙은 남색에 검은 줄무늬, 날카로운 발톱과 푸른 신안을 지닌 범 형상의 용수.',len:'약 7–11m',pow:'명변(明辨)·신판(神判). 맹세와 계약의 진위를 감지하고 금고와 봉인을 건다.',lim:'계약의 진위는 가려도 마음은 읽지 못한다.',off:'정식 제례, 바둑 한 판.',
  led:['초대 용계의 조문을 직접 처음부터 끝까지 검토했다. 아홉 중 유일하게 꼼꼼히 읽은 사람이다.','한 계약주를 깊이 사랑한 적이 있다. 그 이야기를 꺼리지 않는다.','용관복과 단어 하나로 세 시간을 논쟁했고, 결국 둘 다 세 번째 단어로 바꿨다.'],note:['곽무구','#a8322a','주차 자리는 내 거야.']},
 {k:'捌',dragon:'부희',name:'용관복',rank:'여덟째',gift:'통문',c:'#cf8233',img:'F08',por:'972078cf-22f0-4117-8099-2dadd3c20ecf?v=4b9986',line:'돌에 새겨진 신문(神文)이라면 저는 읽을 수 있어요. 종이에 쓰인 건, 그대, 누가 썼느냐에 따라 다르죠.',
  form:'살짝 말린 두 뿔과 비문 같은 천연 무늬가 새겨진 비늘을 지닌, 길게 똬리를 트는 흰 용.',len:'약 9–14m',pow:'통문(通文)·명령(銘靈). 신문과 봉인을 해독한다.',lim:'신문과 남은 기록은 읽어도 모든 역사를 알지는 못한다. 기록은 불완전하거나 고쳐져 있을 수도 있다.',off:'그대가 들려주는 이야기, 손으로 쓴 축문.',
  led:['형제들이 수백 년 전에 저지른 바보짓을 이름만 바꿔 소설에 썼다. 유연추와는 그중 한 권의 판권 문제로 지금도 싸운다.','가장 길게 마감을 어긴 건 열한 달. 원고와 함께 에그타르트 한 상자를 편집자에게 건넸다.','양현도의 집에 자주 밥 얻어먹으러 간다.'],note:['용관복','#cf8233','제 두루마리는 제가 엮었어요, 그대. 이해충돌 회피의 정반대죠.']},
 {k:'玖',dragon:'이문',name:'은조야',rank:'막내',gift:'탄화',c:'#b02a37',img:'F09',por:'29cbf814-7b70-4a07-b3ca-3db93f3c8bdc?v=d6fa6a',line:'막내는 불을 삼킬 수 있어요. 캐러멜 맛이 난대요.',
  form:'물고기 꼬리에 용의 몸, 등에 지느러미 능선이 있는 용수. 거대한 입으로 영화(靈火)와 재앙의 기운을 삼킨다.',len:'약 10–16m',pow:'탄화(呑火)·소재(消災). 영화와 재앙의 기운 일부를 삼킨다.',lim:'불을 삼켜 재앙을 없앨 수는 있어도 세상의 모든 힘을 삼킬 수는 없다.',off:'함께 한잔, 친밀한 접촉.',
  led:['행궁을 태운 그 사건의 다른 한 명이다.','1970년대 완차이에 첫 가게를 열었다. 간판은 축명가가 디자인했는데 너무 밝아서 이웃들이 민원을 넣었다.','양현도는 그가 다실에 향수 냄새를 묻혀 오는 걸 금했다. 그는 매번 묻혀 온다.'],note:['양현도','#7a6230','매번이 아니야. 한 번도 빠짐없이야.']}
];

 {d:'초하루',s:'제1일',ev:'새해 첫 제례. 그대가 처음으로 제사를 주관하고, 첫 세배 손님들이 찾아온다.',who:[
   P('셋째 종조부 소정','79세 · 종족 어른','항렬을 따지고 고지식하며 체면을 중시한다. 제례에 밝고 젊은이를 가르치기 좋아하지만, 다음 순간엔 종주에게 정식 종문 예를 올려야 한다.',{k:'용계는 알지만 아홉의 본모습을 전부 보지는 못했다.',m:'곽무구를 가장 무서워한다. 조언은 할 수 있어도 종주 대신 택주할 수는 없다.',h:['축명가','#c9637f','올해는 새로운 걸 생각해 뒀어.']}),

 {d:'초이틀',s:'제2일',ev:'종족 단체 세배와 분초이 잔치. 그대는 상석에 앉아 세배를 받는다. 막내는 막 일어났을지도 모르고, 여섯째 형은 언제 밥 먹냐에만 관심이 있다.',img:['sc-poonchoi','분초이 잔치'],who:[

   P('채녕','33세 · 홍보·행사 기획','사진 찍기, 모임 잡기, 소문 캐기를 좋아한다. 비즈니스 행사에서 축명가를, 클럽에서 은조야를 만난 적 있지만 둘 다 「옛 저택 쪽 친척」일 줄은 몰랐다.',{k:'용계의 진실은 모른다. 하 집사가 출입 범위를 정한다.',h:['은조야','#b02a37','우리 가게에서 인증샷 찍었더라. 아는 척 안 했어.']}),

 pro:{no:'서　장',h:'섣달그믐 밤',narr:['섣달그믐 밤, 하 집사가 놋쇠 열쇠 꾸러미를 그대 손에 쥐여 주며 장서루에 아직 불이 켜져 있다고 말한다.','문을 밀고 들어가니, 서가 앞에 흰 머리의 남자가 앉아 차를 따르고 있다.','!「그대, 마침 잘 왔어요.」','그는 일어나지 않고 등불 하나를 그대 앞으로 밀어 준다. 「내일이면 계약을 맺겠군요. 오늘 밤엔 먼저 이야기 하나 들어 봐요.」'],
  sum:'세목 · 장서루 범례',fanli:['장서루의 책은 사흘 기한으로 빌려 갈 수 있다. 기한을 넘기면 편자가 직접 받으러 가서, 겸사겸사 차를 마신다.','악기장, 종문 옛 문서, 봉비고의 물건은 대출하지 않는다. 그 자리에서 열람할 것.','어떤 소장품은 관리자의 동의가 있어야 볼 수 있다. 관리자가 거절하면 억지 부리지 말 것. 억지 부려도 소용없다.','편자의 안어는 사견이며 종문의 공식 해석이 아니다. 공식 해석은 제사관 고 선생께, 혹은 일곱째 형에게 물을 것. 후자는 수수료로 바둑 한 판을 받는다.','대출 카드는 사실대로 적을 것. 곽무구, 이건 너한테 하는 말이다.'],
  slips:slp('축명가','#c9637f','여덟째 형 대출 규정은 세관보다 빡빡해. 저번에 만화책 한 권 빌리는데 서류를 세 장 썼어.')+slp('곽무구','#a8322a','썼거든.',1)},
 ch1:{no:'제 1 장',h:'물에 잠긴 산하',narr:['아주 오래전, 용왕의 용위가 수부 밖으로 넘쳐 큰물이 산과 강을 덮었다.','종문의 초조가 사람들을 이끌고 찾아가 아주 긴 담판을 벌였다. 인간은 대대로 공봉을 바치고, 용족은 용위를 거두며, 아홉 아들은 남아서 이 땅을 지킨다.','아버지는 아주 남는 장사라고 생각했다.','!말썽꾼 아들 아홉, 마침 누가 좀 맡아 줘야 했으니까.'],
  cap:['초조의 입계','대대로 바치는 공봉과, 용위를 거두고 이 땅을 지키는 아홉 아들.'],sum:'세목 · 초계록, 승사보, 그리고 용왕',
  more:`<h3>《초계록》 잔본 열두 권</h3><div class="biblio"><span>보관: 장서루 제1가</span><span>대출 가능(사본)</span></div>
<p>용계는 양방향의 신계다. 종문은 공봉으로 아홉의 신성을 기르고, 아홉은 신통으로 이 산하를 지킨다. 노예 계약도, 혼인 계약도 아니다.</p>
<p class="anyu">원본은 진작 사라졌고, 남은 건 수천 년 동안 베끼고 또 베낀 사본이라 권마다 내용이 조금씩 다르다. 당시 현장에 있던 증인이 아직 한 명 살아 있다. 수족의 조칠공이다. 취했을 때 들려주는 판본이 가장 재미있는데, 신빙성은 별개다.</p>
<h3>그 거래를 각자 어떻게 보았나</h3><ul><li>용왕: 좋은 거래였다. 수천 년이 지나도 그렇게 생각한다.</li><li>초조: 인간 세상에 평안을 사 왔다.</li><li>아홉: 아버지에게 팔렸다고 여긴 이도, 공짜 숙소가 생겼다고 여긴 이도, 계약서를 제대로 읽지도 않은 이도 있다. 일곱째 형은 조문을 처음부터 끝까지 검토했다. 그만은 예외다.</li></ul>
${slp('곽무구','#a8322a','이 페이지 글자 너무 많아. 넘김.')}
<h3>《승사보》</h3><div class="biblio"><span>보관: 장서루 제2가</span><span>대출 가능</span></div>
<p>종주의 자리는 혈맥이 용계와 얼마나 공명하는지로 이어지며, 나이·성별·재산·서열은 따지지 않는다. 자리가 비면 사당의 용계 석단이 섣달 그믐께 다음 사람을 가리킨다.</p>
<p>종주가 정할 수 있는 것: 제례와 공봉의 배치, 종문 공유 재산과 큰 수리, 방문객과 개방 구역, 직원의 주요 임면, 택주 여부.</p>
<p>종주가 정할 수 없는 것: 아홉의 사유 재산과 직업과 애인, 아홉이 종주를 사랑하게 될지 여부, 아홉의 사적인 행동, 그리고 신계를 무시하고 그들이 지키는 땅을 처분하는 일.</p>
<p>종주는 관리자이자 계약을 잇는 사람이지, 아홉의 주인이 아니다.</p>
${slp('축명가','#c9637f','「아홉이 종주를 사랑하게 될지 여부」는 종주가 정할 수 없다니, 대체 어느 대 종주가 그런 걸 물어봤던 거야? 너무 궁금해.')}
<h3>용왕과 《수부래전》</h3><div class="biblio"><span>보관: 제1가 별도 상자</span><span>대출 불가</span></div>
<p>용왕은 아홉의 아버지이자 초대 용계를 맺은 이로, 그 용위는 아들들을 훨씬 넘어선다. 아들들을 종문에 맡긴 것은 절반은 수해를 멈추기 위한 거래였고, 절반은 인간과 어울려 사는 법을 배우게 하려는 뜻이었다.</p>
<p>그는 평소 종문 일에 관여하지 않고, 아들들 뒷수습도, 집안싸움 심판도 하지 않으며, 직접 모습을 드러내지 않는다. 설이면 수족의 사자를 통해 해저 골동품 한 상자, 심해 영초 몇 포기, 혹은 아홉만 읽을 수 있는 짧은 쪽지를 보내오기도 한다.</p>
<p class="anyu">이 상자엔 해마다 온 쪽지가 들어 있는데, 대부분 「알았다」 「소란 피우지 마라」, 그리고 날씨 이야기다. 가장 긴 것이 아홉 글자인데, 우리 아홉은 저마다 다르게 읽었다.</p>
${slp('은조야','#b02a37','작년에 온 해저 골동품은 우리 가게 장식으로 썼어. 손님들이 다 안목 좋다더라. 아버지는 몰라도 돼.',1)}`},
 ch2:{no:'제 2 장',h:'사당',narr:['내일 아침, 그대는 여기에 서게 된다.','위로는 아홉 신감, 아래로는 초대 용계 석단. 고 선생이 아주 긴 축문을 읽은 다음 택주할지 묻는다. 한 명을 주봉으로 고를지, 아무도 고르지 않을지.','!「그대, 고르든 안 고르든 앞으로 삼십 일 동안 우리 아홉은 모두 이 집에서 살아요.」'],
  sum:'세목 · 용계 제전기(제사관 필사본)',
  more:`<div class="jidian"><div class="jt">용계 제전기</div><div class="jb">제사관 고중의 삼가 적음</div>
<p>역대 제례에 따라 용계의 여러 의식을 아래에 적어 새 종주께 올린다. 문장이 예스러우니 너그러이 보아주시라.</p>
<h4>一 · 석단이 가리킴</h4><p>종주의 자리가 비면 사당의 용계 석단이 섣달에 문양을 드러내 이을 사람을 가리킨다. 종문은 새해 전에 그를 진란원으로 모셔 오고, 정월 초하루에 정식으로 자리를 잇는다.</p>
<h4>二 · 새해의 동거</h4><p>새 종주가 자리를 이으면 아홉 아들은 모두 진란원으로 돌아와 종주와 삼십 일을 함께 산다. 정월 초하루가 제1일이다. 낮에는 자유롭게 일하고 외출하고 벗을 만나며, 밤에는 원칙적으로 집에 돌아온다. 택주 여부와 관계없이 열 명이 함께 산다. 종주가 오래 홍콩을 떠나면 날짜 계산은 멈추되 이미 채운 날은 무효가 되지 않는다. 용계는 감금이나 위해로 이행을 강제하지 않는다.</p>
<h4>三 · 택주</h4><p>종주는 아홉 중 한 명을 이 대의 주봉으로 고를 수 있다. 의식: 종주가 구룡 사당에서 고른 이에게 향을 올리고 용계 위에 주사 붓을 대면, 제사관이 이름을 부른다. 삼십 일 안이라면 종주가 정한 날 언제든 행할 수 있으며 초하루에 얽매이지 않는다.</p><p>주봉은 주된 동반을 맡고 종주의 개인 공봉을 먼저 받는다. 나머지 여덟은 평소대로 함께 살며 종주와 저마다 관계를 맺을 수 있다. 택주가 정하는 것은 공봉의 순서와 경중뿐, 거취를 정하지 않으며 주봉에게 독점·혼인·친밀의 권리를 주지 않는다. 고를지, 누구를 고를지는 오직 종주가 정하며, 누구도 대신 고를 수 없다. 종족 어른도 마찬가지다.</p>
<h4>四 · 공계</h4><p>종주가 택주하지 않으면 아홉이 함께 계약을 지니며 동반의 책임을 나눈다. 한가한 이, 마침 외출하는 이 누구든 종주에게 동행을 청할 수 있다.</p>
<h4>五 · 공봉</h4><p>계약을 이은 종주의 몸에는 아홉과 공명하는 영력이 깃든다. 영력은 분향, 축원, 음악, 의식, 동반, 그리고 서로 원하는 친밀함으로 전해진다(이 조항은 역대 제사관이 모두 건너뛰었으니 본인도 그리하겠다). 친밀함은 계약 이행의 필수가 아니며 제사보다 효과가 좋다는 보장도 없다. 주봉은 개인 공봉을 더 많이 받고, 나머지 여덟은 사당의 공동 제례로 기본 영력을 얻는다. 아홉은 며칠 공봉이 없다고 약해지지 않으니 종주는 당황하지 마시라. 아홉 각자의 취향은 제례에 실려 있지 않으니, 본인에게 물으시라.</p>
<h4>六 · 제약</h4><ul><li>아홉은 용위로 비호받는 땅을 해쳐서는 안 된다.</li><li>아홉은 종주를 해치거나 공봉을 빼앗아서는 안 된다.</li><li>종주는 주봉이라는 이름으로 아홉에게 신성을 거스르도록 명할 수 없다.</li><li>종주는 아홉의 사유 재산, 직업, 애인, 사생활을 좌우할 수 없다.</li></ul>
<h4>七 · 계약 위반</h4><p>계약이 어겨지면 용계가 먼저 경고한다. 영문의 이상, 공봉의 불균형, 신단의 울림. 지키는 영맥을 일부러 망가뜨린 아들은 해당 신통이 제한되며 스스로 바로잡아야 한다. 종주의 한때 실수는 제례를 다시 올리면 되며 다치는 일은 없다.</p>
<h4>八 · 제30일</h4><p>제30일, 사당에서 계약 완료의 의식을 올린다. 간소하니 성장할 필요는 없다. 의식이 끝나면 동거의 약속은 풀리고 아홉은 저마다 뜻대로 머물거나 떠난다. 종주는 여전히 종주이며, 삼십 일은 계약의 시작이지 끝이 아니다.</p>
<p class="colo">이상 여덟 가지는 모두 제례에 실린 바이다.<br>섣달 · 고중의 삼가 적음<span class="seal">仲儀</span></p></div>
${slp('양현도','#7a6230','제전기에 적힌 향은 너무 독해. 노산 백단을 써. 사당에 두 상자 보내 뒀어.')}`},
 ch3:{no:'제 3 장',h:'아홉 아들',narr:['내일 그대는 정장, 청바지, 에나멜 바지를 입은 남자 아홉을 만나게 된다.','!「하지만 인간이 글자를 배우기 전에, 우리는 이렇게 생겼었어요.」'],sum:'세목 · 비인간 세계와 차폐술',
  more:`<p>지금도 신수, 산귀, 여우 요괴, 정령 같은 비인간 족속이 존재하며, 대부분의 사람은 그 사실을 모른다. 비인간에게 통일된 정부는 없고, 각지의 옛 약속과 영역, 혈통과 인정으로 질서를 유지한다. 그들은 인간 세상에서 장사하고 연애하고 친구를 사귄다. 모두 선하지도, 모두 악하지도 않으며, 나이가 많을수록 윤리관이 인간과 멀어진다.</p>
<p><b>차폐술.</b> 바깥에서 아홉은 뿔과 꼬리와 비늘을 거둔다. 조금 드러나더라도 희미한 차폐술 덕에 보통 사람은 장신구나 분장, 빛의 장난으로 여긴다. 차폐술은 기억을 건드리지 않으며, 카메라나 강한 신통에는 통하지 않을 수도 있다.</p>
<p><b>현대의 신분.</b> 아홉은 모두 합법적인 신분과 경력을 갖고 있다. 영생은 긴 주기로 신분을 바꾸고 사업을 넘기는 식으로 처리한다. 오래 알고 지낸 인간들은 대개 그들이 한 오래된 집안 출신이라고만 안다.</p>
<p><b>진란원의 위치.</b> 비인간 세계에서 진란원은 용계의 보호를 받는 오래된 종문의 본거지일 뿐, 비인간 사회의 수도는 아니다. 비인간 방문객은 신분과 용건을 알려야 하며 하 집사가 명부에 적는다. 어떤 방문객도 저택 안에서 대규모 환술, 결투, 봉인 파괴를 해선 안 된다. 아홉의 친구도 예외가 아니다.</p>
<p>아래 몸길이는 모두 본모습을 접었을 때의 크기이며, 신통을 쓸 때는 영상(靈相)이 더 커진다. 아홉은 사당과 뒷산에서 완전히 본모습이 되면 안 된다. 지난번에 누가 그랬다가 사당 대들보를 하나 갈았다.</p>
${slp('고소형','#2f5079','「모두 선하지도, 모두 악하지도 않다」——여덟째, 이 문장의 적용 대상을 명확히 해 줘.')}`},
 ch4:{no:'제 4 장',h:'진란원',narr:['내일 그대는 앞마당의 청벽돌 문루로 들어오게 된다.','정청을 지나면 안뜰이다. 노목과 박석 바닥, 회랑. 간식도, 말다툼도, 볕 쬐기도 다 거기서 한다.','동원은 큰형의 금실이다. 그의 고금은 만지지 마라.','뒷산 가장 높은 곳이 관풍대다. 셋째 형이 늘 거기 있고, 나무에 풍경이 몇 개 걸려 있다.'],
  scenes:[['안뜰','해마다 누군가 춘련이 비뚤다고 한다.'],['동원 금실','고금 옆에 신시사이저가 한 대 놓여 있다.'],['관풍대','뒷산 꼭대기, 누각 앞의 돌 단.']],
  sum:'세목 · 진란원 전도, 방 배정과 저택 규칙',
  intro:'<p>진란원은 신계 위안랑 금전(錦田)의 외딴 산자락에 있으며, 사유 산길로 금전 시내와 이어진다. 겉은 오래되었지만 살기엔 현대적이다. 초대 용계가 남긴 지하의 용계 석단과 진수석 기단, 고대의 사당·비랑·장서루, 명청 이후의 청벽돌 본관과 안뜰과 담장, 20세기에 더한 주방과 숙소, 그리고 오늘날 더한 스위트룸·엘리베이터·에어컨·차고·인터넷·보안까지. 잴 때마다 길이가 다른 복도가 하나 있다.</p>',
  rules:`<h3>저택 규칙</h3><ul><li>개인 방은 동의를 얻어야 들어갈 수 있다.</li><li>사당은 공동 제사 공간이며, 개인 공봉은 각자의 공간에서 해도 된다.</li><li>뒷산은 파헤치지 않는다. 산책은 괜찮다.</li><li>삼십 일 동안 이 저택이 거처이며, 낮에는 자유롭게 드나든다.</li><li>열 명의 방 배정은 택주와 무관하다. 주봉으로 뽑혔다고 종주의 방으로 옮기지 않는다.</li></ul>
${slp('백회석','#5e9c90','서원 바닥은 내가 갈았어. 두 번.')}${slp('잠귀수','#8f6a3c','관풍대엔 문이 없으니까 열쇠 찾지 마. 올라올 땐 물 챙기고.',1)}`},
 ch5:{no:'제 5 장',h:'삼십 일',narr:['이 삼십 일은 조용하지 않을 거예요.','초이틀엔 온 집안이 세배를 오고 분초이가 상을 가득 채운다. 초사흘은 적구인데, 늙은 자라는 하필 그날 와서 욕을 한다. 초나흘부터 엿새까지는 사람이 아닌 옛 친구들이 선물을 들고 찾아온다.','보름 정월대보름엔 난경대가 안뜰에 수백 년 전의 등불을 띄워 줄 것이다.']},
 ch6:{no:'제 6 장',h:'집 안의 아홉 물건',narr:['오래 살다 보면 알게 될 거예요. 이 집에는 아무도 손대려 하지 않는 물건들이 있다는 걸.','줄 끊어진 고금, 금이 간 옛 종, 낡은 단체 사진…… 다 사연이 있어요.','!「그대, 사연이라는 건 정말로 듣고 싶어질 때 자연히 누군가 말해 줘요.」'],sum:'세목 · 소장품 등록',anyu:'이 권은 품명과 보관처, 취급 제한만 적는다. 그 밖은 싣지 않는다.'},
 epi:{no:'종　장',h:'곧 날이 밝는다',narr:['창밖 하늘이 한 겹 옅어졌다.','!「가기 전에 대출 카드에 이름 하나 적어 줘요.」','그가 카드를 밀어 준다. 「제 형제들 대출 기록은 봐도 돼요. 따라 하진 말고요.」']},
 secret:{warn:'목록에 올리지 않은 사사로운 기록입니다. 아홉의 옛일이 적혀 있습니다.<br>읽고 나면, 그들이 직접 말해 주지 않은 것들을 알게 됩니다.',open:'그래도 펼친다',h:'미편목',sub:'용관복의 사록',
  intro:'그대, 여기까지 찾아왔군요. 그럼 있는 그대로 적을게요. 아래의 당사자들은 모두 살아 있고, 모두 아직 이 집에 살아요. 그들이 그 일을 어떻게 보는지는 그들의 몫이고, 저는 무슨 일이 있었는지만 적어요.',
  items:[
   ['부록 · 存・壹 · 줄 끊어진 고금','안청징','<p>수백 년 전, 한 도시가 사악한 소리에 홀렸다. 큰형은 금 소리로 도시 전체의 소리를 봉했다. 재앙은 막았지만, 그 도시의 많은 이들이 다시는 소리를 듣지 못하게 되었다. 금 안쪽에는 그 도시의 옛 이름이 새겨져 있다. 그는 부정하지도, 용서를 구하지도 않는다. 그때는 더 나은 방법이 없었다고만 말한다. 필요하다면 그는 또 그렇게 할 거라고 나는 믿는다.</p>'],
   ['부록 · 存・貳 · 애자 금령','곽무구','<p>둘째 형이 보호하던 인간들이 함정에 빠져 살해당했다. 그는 음모에 가담한 가문들을 뿌리째 뽑았고, 어린아이도, 아무것도 모르는 후손도 남기지 않았다. 당대 종주가 용계에 따라 요구하고 일곱째 형이 나서서야 멈췄다. 금령은 그 뒤에 생겼다. 사적인 원한에 무관한 이를 끌어들이지 말 것. 그는 용서가 필요하다고 생각하지 않는다. 후회하느냐고 물으면, 아마 그 개자식을 사흘 더 살려 둔 게 후회된다고 할 것이다.</p>'],
   ['부록 · 存・參 · 옛 단체 사진','잠귀수','<p>수백 년 전, 한 계승자가 셋째 형을 주봉으로 골랐다. 함께 다니던 중 그는 한 무리가 제멋대로 산에 들어가도록 내버려 두었고, 산사태 뒤 살아 돌아온 이는 절반도 되지 않았다. 둘은 그 일로 다투고 한동안 헤어졌다가 나중에 화해했고, 그 사람은 그의 곁에서 생을 마쳤다. 여섯째 형은 그때 뒤늦게 도착해 남은 산을 붙드는 것밖에 할 수 없었다. 앨범장의 그 사진은 여러 해 뒤에 복원한 것이다.</p>'],
   ['부록 · 存・肆 · 옛 종의 금','축명가','<p>넷째 형은 어린 시절 장난으로 천재지변이 닥칠 때의 용명을 흉내 냈다. 한 마을이 공황에 빠져 서로 짓밟았고 사상자가 났다. 당대 종주는 사상자 명부를 그 앞에 던지고 이름을 하나하나 다 읽게 했다. 종의 금은 그때 그를 억지로 멈추며 생긴 것이다. 그 뒤로 그는 어떤 놀이가 사람을 죽이는지 가릴 줄 알게 되었다. 그러고도 여전히 짓궂다.</p>'],
   ['부록 · 存・伍 · 비호의 성의 옛 가문들','양현도','<p>난리 통에 다섯째 형은 많은 백성을 거두었다. 한 도시를 지키려고 모든 출입구를 봉쇄했다. 백성은 전화를 피했지만 떠날 자유를 잃었다. 어느 대의 종주는 그가 「사람을 기르는 게 아니라 새장을 기르고 있다」고 했고, 그는 「새장 밖에선 그때 사람들이 죽고 있었다」고 답했다. 산 위의 저택은 그때의 피난처에서 비롯되었고, 그 옛 가문들은 지금도 그에게 기대어 산다. 그는 질서에는 대가가 있다고 믿는다.</p>'],
   ['부록 · 存・陸 · 지하 석비','백회석','<p>지맥이 갈라질 때, 여섯째 형은 마을 사람들이 대피하기를 기다리지 않고 본모습으로 산을 눌렀다. 마을은 사람째로 땅에 묻혔고, 대신 다른 고을들이 살아남았다. 그가 산을 누르고 있다는 건 비밀이 아니다. 산 아래에 마을이 있었다는 게 비밀이다. 석비에는 봉산한 위치와 희생자의 이름이 새겨져 있다. 그는 이름을 하나하나 다 기억하며, 그래도 같은 선택을 할 것이다.</p>'],
   ['부록 · 存・柒 · 옛 심판당 판결문','고소형','<p>일곱째 형이 깊이 사랑했던 그 계승자는 제물로 바쳐질 사람들을 구하려고 종문과 지방 신의 부속 신계를 몰래 고쳤다. 사람들은 구했지만 봉인이 깨졌다. 일곱째 형은 직접 심리하여 율법대로 연인에게 십 년 금고를 선고했고, 판결문 끝에는 그의 친필 서명이 있다. 그는 그 사랑 이야기를 꺼리지 않는다. 재판의 세부는 외부인에게 말하지 않으니, 나도 여기까지만 적는다.</p>'],
   ['부록 · 存・捌 · 고쳐 쓴 사서','용관복','<p>사서를 정리하다가, 존경받는 한 종문 조사가 사리사욕을 위해 수많은 무고한 이를 희생시켰다는 걸 알았다. 종문이 갈라지지 않도록 나는 희생자의 이름을 지우고 그의 욕심을 희생으로 고쳐 썼다. 그는 지금도 성현으로 받들어진다. 일곱째 형은 내가 고쳤다는 걸 알지만, 원본이 어디 있는지는 모른다.</p><p>원본이 어디 있는지는, 그대, 이 조목만은 적지 않을게요. 빛을 보게 할지는 종주가 정할 일이에요. 마음을 정하면 저를 찾아와요.</p>'],
   ['부록 · 存・玖 · 불에 일그러진 금장신구','은조야','<p>한 도시의 권력자가 사술로 무고한 이들을 제물로 바쳤다. 도시에 큰불이 난 그날 밤, 막내는 성 밖에 앉아 밤새 지켜보았다. 불길이 이웃 마을까지 번지고서야 나서서 불을 삼켰고, 미처 빠져나오지 못한 무고한 이들이 있었다. 그 금장신구는 살아남은 이가 그에게 따져 묻기 위해 보낸 물건이다.</p>']],
  outro:'다 적었어요. 이 책은 목록에 없으니 못 본 걸로 해도 돼요. 그대가 알게 됐다고 해서 그들이 다른 누군가가 되지는 않아요. 그들을 어떻게 볼지는 그대가 정해요.'}
};
