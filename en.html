 ch1:{no:'Chapter I',h:'The Flood',narr:['Long ago, the Dragon King’s might spilled out of his water palace, and the floods covered mountains and rivers.','The founder of the sect led his people to petition him, and they bargained for a long time: humans would make offerings for generations; the dragons would rein in their might; and the nine sons would stay behind to guard this land.','Father thought it was a very good deal.','!Nine troublesome sons, and someone to manage them at last.'],
  cap:['The First Pact','Offerings for generations, in exchange for restraint, and nine sons to guard the land.'],sum:'Details · The First Pact, the line of succession, and the Dragon King',
  more:`<h3>Record of the First Pact, twelve surviving volumes</h3><div class="biblio"><span>Shelf 1</span><span>Copies may be borrowed</span></div>
<p>The Dragon Pact runs both ways: the sect nourishes the sons’ divinity with offerings; the sons protect the land with their powers. It is not a bond of servitude, and it is not a marriage.</p>
<p class="anyu">The original is long gone. What survives was copied and recopied for thousands of years, and the volumes don’t quite agree. One witness of the signing is still alive: Elder Chiu of the waters. His drunken version is the best one. Its accuracy is another matter.</p>
<h3>That deal, as each side saw it</h3><ul><li>The Dragon King: a good bargain, and he still thinks so thousands of years later.</li><li>The founder: peace bought for the human world.</li><li>The nine: some felt their father sold them; some felt they got free lodging; some never read the contract properly. Seventh Brother read every clause. He is the exception.</li></ul>
${slp('Huo Wujiu','#a8322a','Too many words on this page. Skipping.')}
<h3>Register of Succession</h3><div class="biblio"><span>Shelf 2</span><span>May be borrowed</span></div>
<p>Succession depends on how one’s blood resonates with the Pact — not age, gender, wealth or birth order. When the seat falls empty, the Pact altar in the shrine points to the next Sect Head at year’s end.</p>
<p>The Sect Head decides: rites and offerings, sect property and major repairs, visitors and which spaces are open, major staff appointments, and whether to Choose.</p>
<p>The Sect Head does not decide: the nine’s property, work or lovers; whether any of them falls in love with you; their private affairs; or what happens to the land they guard in defiance of the Pact.</p>
<p>The Sect Head is a steward and the holder of the Pact, not the nine’s master.</p>
${slp('Zhu Mingke','#c9637f','“Whether any of them falls in love with you” is not the Sect Head’s call — which Sect Head asked about that? I need to know.')}
<h3>The Dragon King and the Letters from the Water Palace</h3><div class="biblio"><span>Shelf 1, separate case</span><span>Not for loan</span></div>
<p>The Dragon King is the nine’s father and author of the first Pact, his might far beyond his sons’. He handed them to the sect half to end the floods, half so they would learn to live among mortals.</p>
<p>He doesn’t manage the sect, doesn’t clean up after his sons and doesn’t referee household squabbles. He never appears in person. At New Year a messenger from the waters may bring a chest of seabed relics, a few deep-sea herbs, or a note only the nine can read.</p>
<p class="anyu">This case holds years of those notes, mostly “Noted”, “Behave” and the weather. The longest has nine characters. The nine of us each read it differently.</p>
${slp('Yin Zhaoye','#b02a37','Last year’s chest of seabed relics is decorating my club. Customers say it’s very tasteful. Father doesn’t need to know.',1)}`},
 ch2:{no:'Chapter II',h:'The Shrine',narr:['Tomorrow morning, you will stand here.','Nine shrines above, the altar of the first Pact below. Master Ko will chant a very long prayer, then ask whether you will Choose: one of us as your Chosen, or none at all.','!“Darling, Choose or not, for the next thirty days all nine of us live in this house.”'],
  sum:'Details · Record of the Pact Rites (copied by the rite-keeper)',
  more:`<div class="jidian"><div class="jt">Record of the Pact Rites</div><div class="jb">Respectfully copied by Ko Chung-yi, keeper of rites</div>
<p>Following the rites of generations past, I set down the ceremonies of the Dragon Pact for the new Sect Head. The wording is old-fashioned; please forgive it.</p>
<h4>I · The Altar Points</h4><p>When the seat is empty, the Pact altar shows its markings at year’s end and points to the successor. The sect brings them home to Zhenlan Manor before the New Year; they take office on the first day of the first month.</p>
<h4>II · Living Together at the Year’s Start</h4><p>When a new Sect Head takes office, all nine sons must return to Zhenlan Manor and live with them for thirty days, counting from New Year’s Day. By day the sons may work, go out and see friends freely; by night they return home. Ten live together, whether or not the Sect Head Chooses. If the Sect Head leaves Hong Kong for long, the count pauses; days already passed still count. The Pact is never enforced by confinement or harm.</p>
<h4>III · The Choosing</h4><p>The Sect Head may choose one son as the Chosen of this generation. The rite: in the Ancestral Shrine, the Sect Head lights incense for the chosen son and marks the Pact in cinnabar, and the rite-keeper calls the name. It may be done on any day within the thirty.</p><p>The Chosen is the main companion and receives the Sect Head’s personal offerings first; the other eight live as usual and may form their own ties with the Sect Head. The Choosing sets only the order and weight of offerings: it decides nothing about who stays, and grants the Chosen no exclusivity, marriage or claim to intimacy. Whether to Choose, and whom, is the Sect Head’s alone; no one may choose for them, not even clan elders.</p>
<h4>IV · Shared Pact</h4><p>If the Sect Head does not Choose, the nine share the Pact and the duty of companionship. Whoever is free, or happens to be heading out, may ask the Sect Head along.</p>
<h4>V · Offerings</h4><p>Once bound, the Sect Head carries a spiritual force that resonates with the nine. It passes through incense, prayer, music, rites, companionship, and closeness freely chosen by both (every rite-keeper before me skipped this clause, and so shall I). Closeness is not required by the Pact, nor is it guaranteed to work better than worship. The Chosen receives more personal offerings; the other eight draw their basic share from the shrine’s shared rites. The sons will not weaken from a few days without offerings. The Sect Head need not panic. What each son prefers is not recorded in the rites. Ask them yourself.</p>
<h4>VI · Bounds</h4><ul><li>The sons may not use their might to harm the lands under protection.</li><li>The sons may not harm the Sect Head or take offerings by force.</li><li>The Sect Head may not use the Choosing to order a son against his divine nature.</li><li>The Sect Head may not control the sons’ property, work, lovers or private affairs.</li></ul>
<h4>VII · Breaches</h4><p>When the Pact is breached, it warns first: odd markings, offerings out of balance, the altar ringing. A son who deliberately damages the ley lines he guards loses some of his power until he makes amends. A Sect Head’s honest mistake is mended by repeating the rite; no harm comes of it.</p>
<h4>VIII · The Thirtieth Day</h4><p>On the thirtieth day a brief rite completes the Pact in the shrine; no formal dress is needed. Afterwards the cohabitation ends, and each son stays or goes as he pleases. The Sect Head remains the Sect Head; the thirty days are the beginning of the Pact, not its end.</p>
<p class="colo">These eight matters are as the rites record.<br>Twelfth month · respectfully, Ko Chung-yi<span class="seal">仲儀</span></p></div>
${slp('Liang Xuandu','#7a6230','The incense in the record is too harsh. Use aged sandalwood. I’ve had two boxes sent to the shrine.')}`},
 ch3:{no:'Chapter III',h:'The Nine',narr:['Tomorrow you’ll meet nine men in suits, jeans and patent-leather trousers.','!“But before humans learned to write, this is what we looked like.”'],sum:'Details · The non-human world and the veil',
  more:`<p>Divine beasts, mountain spirits, fox spirits and other non-humans still exist today, and most ordinary people have no idea. There is no single non-human government; order is kept by old local pacts, territory, bloodlines and favours owed. They trade, love and make friends in the human world. They are not all good, nor all bad, and the older they are, the less human their ethics.</p>
<p><b>The veil.</b> Out in the world the nine hide their horns, tails and scales. When a little slips out, a faint veiling makes ordinary people see an accessory, a costume or a trick of the light. The veil doesn’t touch memory, and may not fool cameras or strong powers.</p>
<p><b>Modern lives.</b> The nine all have legal identities and work records. Living forever is handled by changing identities and handing over businesses on a long cycle. Humans who know them for years mostly think they all come from one old family.</p>
<p><b>Where the manor stands.</b> To the non-human world, Zhenlan Manor is an old sect seat protected by the Pact, not the capital of anything. Non-human visitors must announce who they are and why they’ve come; Uncle Ho keeps the register. No visitor may cast large illusions, duel or break seals in the house, the nine’s friends included.</p>
<p>All lengths below are for a folded-down true form; their spirit-shape can grow larger when they use their powers. The nine should not fully transform in the shrine or on the back hill. The last time someone did, the shrine needed a new beam.</p>
${slp('Gu Zhaoheng','#2f5079','“Not all good, nor all bad” — Eighth, please specify who that applies to.')}`},
 ch4:{no:'Chapter IV',h:'The Manor',narr:['Tomorrow you’ll walk in through the grey-brick gatehouse.','Past the main hall is the courtyard: the old tree, the flagstones, the covered walkways. Snacks, arguments, sunbathing — it all happens there.','The East Court is Big Brother’s music room. Don’t touch his guqin.','The highest point of the back hill is the Wind Terrace. Third Brother is usually up there, and there are wind chimes in the trees.'],
  scenes:[['Courtyard','Every year someone says the couplets are crooked.'],['East Court music room','There’s a synthesizer next to the guqin.'],['Wind Terrace','The stone terrace before the pavilion at the top of the hill.']],
  sum:'Details · Map of the manor, rooms and house rules',
  intro:'<p>Zhenlan Manor sits on a remote hillside at Kam Tin, Yuen Long, in the New Territories, linked to town by a private road. Old outside, modern to live in: the first Pact left the altar and the flood-stones below ground; antiquity left the shrine, the stele gallery and the library; the Ming and Qing left the brick halls, courtyard and walls; the twentieth century added the kitchen and quarters; today added suites, a lift, air-conditioning, a garage, Wi-Fi and security. There is a corridor that measures differently every time.</p>',
  rules:`<h3>House rules</h3><ul><li>Private rooms may only be entered with permission.</li><li>The shrine is shared; private offerings may also be made in one’s own rooms.</li><li>No digging on the back hill; walking is fine.</li><li>For the thirty days the manor is home; leave freely by day.</li><li>Rooms have nothing to do with the Choosing. The Chosen doesn’t move into the Sect Head’s suite.</li></ul>
${slp('Bai Huaishi','#5e9c90','I replaced the West Court floors. Twice.')}${slp('Cen Guixiu','#8f6a3c','The terrace has no door, so don’t look for a key. Bring water.',1)}`},
 ch5:{no:'Chapter V',h:'Thirty Days',narr:['These thirty days won’t be quiet.','On the second day the whole clan comes, and poon choi covers the table; the third is a day for quarrels, which is exactly when the Old Turtle drops by to curse us out; from the fourth to the sixth, a few old friends who aren’t human arrive bearing gifts.','On the fifteenth, at the Lantern Festival, Lan Keng-toi will light the courtyard with lanterns from centuries ago.']},
 ch6:{no:'Chapter VI',h:'Nine Objects',narr:['Stay here long enough and you’ll notice some things in this house nobody will touch.','A guqin with broken strings, an old bell with a crack, an old photograph… They all have histories.','!“Darling, histories like that — when you truly want to hear them, someone will tell you.”'],sum:'Details · Register of holdings',anyu:'This register lists only the name, location and who will handle each item. Nothing more.'},
 epi:{no:'Epilogue',h:'Almost Dawn',narr:['The sky outside the window has paled a shade.','!“Before you go, sign the loan card.”','He slides it over. “You can look at my brothers’ borrowing records. Just don’t follow their example.”']},
 secret:{warn:'This is a private record that was never catalogued. It tells the nine’s old stories.<br>Once you read it, you’ll know things they haven’t told you themselves.',open:'Open it anyway',h:'Uncatalogued',sub:'Rong Guanfu’s private record',
  intro:'Darling, you found it. Then I’ll write it plainly. Everyone below is still alive and still lives in this house; how they see what they did is their own business. I only record what happened.',
  items:[
   ['Appendix · No. 1 · Guqin with Broken Strings','Yan Qingzhi','<p>Centuries ago, a city fell under the spell of an evil sound. Big Brother sealed every sound in that city with his guqin. The disaster was contained, and many of its people never heard again. The city’s old name is carved inside the instrument. He doesn’t deny it and doesn’t ask forgiveness; he only says there was no better way. I believe that, if he had to, he would do it again.</p>'],
   ['Appendix · No. 2 · The Yazi Edict','Huo Wujiu','<p>Mortals under Second Brother’s protection were murdered in a trap. He tore out every family involved by the roots, sparing neither children nor descendants who knew nothing, until the Sect Head of the day invoked the Pact and Seventh Brother stepped in to stop him. The edict came after: no one may drag the uninvolved into a private feud. He doesn’t think he needs forgiving. Ask if he regrets it, and he’ll probably say he regrets letting the bastard live three more days.</p>'],
   ['Appendix · No. 3 · The Old Photograph','Cen Guixiu','<p>Centuries ago, an heir chose Third Brother. While they travelled together, he let a party go into the mountains on their own risk; after the landslide, fewer than half came back. The two of them fought over it and parted for a while. Later they made up, and that person lived out their life with him at their side. Sixth Brother arrived too late to do anything but hold the rest of the mountain in place. The photograph in the album cabinet is a reproduction made years later.</p>'],
   ['Appendix · No. 4 · Crack in the Ancient Bell','Zhu Mingke','<p>When Fourth Brother was young, he mimicked the roar that warns of a coming catastrophe, for fun. A town stampeded in panic, and people were hurt and killed. The Sect Head of the day threw the list of casualties in front of him and made him read every name aloud. The crack in the bell was left when they forced him to stop. Since then he has known which games kill people. Then he went on being awful.</p>'],
   ['Appendix · No. 5 · Old Families of the Sheltered City','Liang Xuandu','<p>In a time of upheaval, Fifth Brother took in a great many people. To save a city, he sealed every way in and out: the people were spared the war, and lost the freedom to leave. One Sect Head said he wasn’t raising people, he was raising a cage. He answered: “Outside the cage, people were dying.” His mansion on the hill grew out of that shelter, and those old families still depend on him. He believes order has a price.</p>'],
   ['Appendix · No. 6 · The Underground Stele','Bai Huaishi','<p>When the ley lines split, Sixth Brother didn’t wait for the villagers to leave. He pressed the mountain down with his true form, and the whole village, people and all, was buried, so that other towns could survive. That he holds a mountain down is no secret. That there was a village beneath it is. The stele records where the mountain was sealed and the names of the dead. He remembers every name, and would make the same choice again.</p>'],
   ['Appendix · No. 7 · Verdict of the Old Tribunal','Gu Zhaoheng','<p>The heir Seventh Brother once loved altered a subsidiary pact between the sect and a local deity, to save people about to be sacrificed. The people were saved. The seal broke. Seventh Brother heard the case himself and, by law, sentenced his lover to ten years’ confinement; his signature is at the end of the verdict. He doesn’t mind talking about that love. The details of the trial he keeps from outsiders, so I’ll stop here.</p>'],
   ['Appendix · No. 8 · The Revised Chronicle','Rong Guanfu','<p>While putting the chronicles in order, I found that a revered patriarch of the sect had sacrificed many innocents for his own gain. So the sect wouldn’t split, I deleted the victims’ names and rewrote his greed as sacrifice. He is still honoured as a sage. Seventh Brother knows I changed it. He doesn’t know where the original is.</p><p>Where the original is, darling, I won’t write down. Whether it sees the light is the Sect Head’s decision. When you’ve decided, come find me.</p>'],
   ['Appendix · No. 9 · The Fire-Warped Gold Ornament','Yin Zhaoye','<p>A city’s ruler sacrificed innocents with dark arts. The night the city burned, the Youngest was just outside it, and he sat and watched all night. Only when the fire reached the neighbouring houses did he step in and swallow it; some innocents didn’t get out. The ornament was sent by a survivor, as a question to him.</p>']],
  outro:'That’s all. This volume isn’t in the catalogue; you may pretend you never read it. They won’t become someone else because you know. How you see them is up to you.'}
};
