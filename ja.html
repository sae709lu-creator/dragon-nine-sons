  sum:'細目・蔵書楼の凡例',fanli:['蔵書楼の本は三日を限りに貸し出す。期限を過ぎた場合は編者が自ら取り立てに伺い、ついでにお茶を頂く。','楽器棚、宗門の旧記録、封碑庫の品は貸し出さない。その場で閲覧のこと。','一部の所蔵品は取扱い人の同意がなければ閲覧できない。取扱い人が断ったら無理強いしないこと。無理強いしても無駄である。','編者の按語は私見であり、宗門の公式見解ではない。公式見解は祀典師の高先生か、七兄に尋ねること。後者は手数料を取る。碁一局。','貸出カードは正直に記入すること。霍無咎、これは君に言っている。'],

 ch1:{no:'第 一 章',h:'水、山河を覆う',narr:['遠い昔、龍王の竜威が水府から溢れ、大水が山河を覆った。','宗門の初祖は人々を率いて龍王に会いに行き、長い長い談判をした。人は代々供奉を捧げ、龍族は竜威を収め、九人の息子はこの地に残って守る。','父上はずいぶん得な取引だと思った。','!手に負えない息子が九人。ちょうど誰かに見てもらう必要があった。'],
  cap:['初祖の立契','代々の供奉と引き換えに、竜は威を収め、九子はこの地を守る。'],sum:'細目・初契録、承嗣譜、そして龍王',
  more:`<h3>『初契録』残本十二巻</h3><div class="biblio"><span>保管：蔵書楼第一架</span><span>貸出可（写本）</span></div>
<p>龍契は双方向の神契である。宗門は供奉で九人の神性を養い、九人は神通でこの山河を守る。隷属の契約でも、婚姻の契約でもない。</p>
<p class="anyu">原本はとうに失われ、残っているのは数千年のあいだ写しに写しを重ねたもので、巻ごとに少しずつ食い違う。立ち会った証人は一人だけまだ生きている。水族の潮七公だ。酔ったときの話がいちばん面白い。信憑性は別として。</p>
<h3>あの取引を、それぞれはどう見たか</h3><ul><li>龍王：いい取引をした。数千年経った今もそう思っている。</li><li>初祖：人の世に安寧を買った。</li><li>九人：父に売られたと思う者、ただの宿ができたと思う者、契約書をろくに読んでいない者もいる。七兄だけは条文を最初から最後まで検めた。彼は例外だ。</li></ul>
${slp('霍無咎','#a8322a','このページ字が多い。飛ばす。')}
<h3>『承嗣譜』</h3><div class="biblio"><span>保管：蔵書楼第二架</span><span>貸出可</span></div>
<p>宗主の座は、血に宿る龍契との共鳴で継がれる。年齢、性別、財産、長幼は問わない。座が空けば、祖堂の龍契の石壇が年の暮れに次の者を指す。</p>
<p>宗主が決められること：祭儀と供奉の段取り、宗門の共有財産と大きな修繕、訪問客と開放する場所、職員の重要な任免、択主するかどうか。</p>
<p>宗主が決められないこと：九人の私財、仕事、恋人。九人が自分を好きになるかどうか。九人の私的な行動。そして神契を無視して彼らの守る地を処分すること。</p>
<p>宗主は管理者であり契約の担い手であって、九人の主ではない。</p>
${slp('祝鳴珂','#c9637f','「九人が自分を好きになるかどうか」は宗主が決められないって、どの代の宗主がそんなこと聞いたの？めちゃくちゃ知りたい。')}
<h3>龍王と『水府来箋』</h3><div class="biblio"><span>保管：第一架・別函</span><span>貸出不可</span></div>
<p>龍王は九人の父であり初代龍契を結んだ者で、その竜威は息子たちを遥かに凌ぐ。息子たちを宗門に預けたのは、半分は水害を止めるための取引、半分は人と共に暮らすことを学ばせるためだった。</p>
<p>普段は宗門のことに口を出さず、息子たちの尻拭いも、家の揉め事の審判もせず、自ら姿を見せることはない。正月には水族の使いを通して、海底の古物を一箱、深海の霊草をいくつか、あるいは九人にしか読めない短い便りを届けてくることがある。</p>
<p class="anyu">この函には毎年の便りが収めてある。ほとんどが「分かった」「騒ぐな」、それに天気の話。いちばん長いものが九文字で、僕たち九人はそれぞれ違う意味に読んだ。</p>
${slp('殷照夜','#b02a37','去年の海底の古物はうちの店の飾りにした。客にはセンスがいいって評判。父上は知らなくていい。',1)}`},
 ch2:{no:'第 二 章',h:'祖堂',narr:['明日の朝、君はここに立つ。','堂の上には九つの神龕、下には初代龍契の石壇。高先生がとても長い祝詞を読み上げてから、君に択主するかを問う。一人を主奉に選ぶか、誰も選ばないか。','!「ねえ君、選んでも選ばなくても、これから三十日、僕たち九人はみんなこの屋敷で暮らすんだ。」'],
  sum:'細目・龍契祭典記（祀典師の手写し）',
  more:`<div class="jidian"><div class="jt">龍契祭典記</div><div class="jb">祀典師　高仲儀　謹んで録す</div>
<p>歴代の祀典に従い、龍契の諸儀を以下に録して新たな宗主の覧に供する。文辞は古風なれど、宗主にはご容赦願いたい。</p>
<h4>一　石壇の指すところ</h4><p>宗主の座が空けば、祖堂の龍契の石壇が年の暮れに紋を顕し、継ぐべき者を指す。宗門は年明け前にその者を鎮瀾院へ迎え、正月元日に正式に座を継ぐ。</p>
<h4>二　歳首の同居</h4><p>新たな宗主が継げば、九子はすべて鎮瀾院に戻り、宗主と三十日を共に暮らす。正月元日を第一日とする。日中は自由に働き、出かけ、友に会ってよいが、夜は原則として屋敷に帰る。択主の有無にかかわらず、十人で暮らす。宗主が長く香港を離れれば日数の数えは止まるが、すでに満ちた日は無効とならない。龍契は監禁や危害によって履行を強いることはない。</p>
<h4>三　択主</h4><p>宗主は九子のうち一人を当代の主奉に選ぶことができる。その儀：宗主が九龍祖堂にて選んだ竜子に香を上げ、龍契に朱筆を入れ、祀典師が名を唱える。三十日のうち、宗主が定めた日にいつでも行ってよく、元日に限らない。</p><p>主奉は主たる伴を務め、宗主個人の供奉を優先して受ける。ほかの八人は普段どおり共に暮らし、それぞれ宗主と関係を結ぶこともできる。択主が定めるのは供奉の順と軽重のみであり、去就を定めず、主奉に独占・婚姻・親密の権利を与えない。選ぶか否か、誰を選ぶかは宗主ひとりが決め、ほかの誰も代わって選べない。一族の長老も同じである。</p>
<h4>四　共契</h4><p>宗主が択主しなければ、九子の共契となり、九人がともに伴の務めを負う。手の空いた者、ちょうど出かける者、誰でも宗主を誘いうる。</p>
<h4>五　供奉</h4><p>契りを継いだ宗主の身には、九子と響き合う霊力が宿る。霊力は焚香、祈り、楽の音、儀式、共に過ごすこと、そして互いが望んだ親密さによって伝わる（この条は歴代の祀典師がみな読み飛ばしてきたので、本人もそうする）。親密さは契約の履行に必須ではなく、祭祀に勝る保証もない。主奉は個人の供奉を多く受け、ほかの八人は祖堂の共同の祭礼から基本の霊力を得る。九子は数日供奉がなくとも弱らないので、宗主は慌てずともよい。九子それぞれの好みは祀典に載っていない。本人に聞かれよ。</p>
<h4>六　約束</h4><ul><li>九子は竜威で庇護される地を害してはならない。</li><li>九子は宗主を害し、供奉を奪ってはならない。</li><li>宗主は主奉の名において九子に神性に背くことを命じてはならない。</li><li>宗主は九子の私財、仕事、恋人、私事を支配してはならない。</li></ul>
<h4>七　違契</h4><p>契りが破られるとき、龍契はまず警告する。霊紋の異常、供奉の不均衡、神壇の鳴動。守る霊脈を故意に壊した子は、その神通が制限され、自ら償わねばならない。宗主の一時の過ちは祭儀を改めて行えばよく、傷つくことはない。</p>
<h4>八　第三十日</h4><p>第三十日、祖堂にて承契完了の儀を行う。簡素な儀ゆえ、正装は要らない。儀が終われば同居の約は解け、九子は各々の意に従って残るも去るも自由である。宗主は変わらず宗主であり、三十日は承契の始まりであって終わりではない。</p>
<p class="colo">右の八事、すべて祀典に載るところなり。<br>歳次臘月　高仲儀　謹んで録す<span class="seal">仲儀</span></p></div>
${slp('梁玄度','#7a6230','祭典記にある香はきつすぎる。老山白檀を使え。祖堂に二箱送らせておいた。')}`},
 ch3:{no:'第 三 章',h:'九子',narr:['明日、君はスーツやジーンズやエナメルのパンツを穿いた九人の男に会う。','!「でも人間が文字を覚える前、僕たちはこういう姿をしていたんだ。」'],sum:'細目・人ならざるものと遮蔽術',
  more:`<p>現代にも神獣、山鬼、狐の妖、精霊などの人ならざる者たちがいて、ほとんどの人はその存在を知らない。彼らに統一された政府はなく、各地の古い約束、縄張り、血筋、義理で秩序を保っている。人の世で商売をし、恋をし、友をつくる。皆が善でも皆が悪でもなく、齢を重ねるほど倫理観は人から離れていく。</p>
<p><b>遮蔽術。</b>外では九人は角も尾も鱗もしまっている。少し出てしまっても、かすかな遮蔽術のおかげで普通の人には装飾品や仮装、光の加減に見える。遮蔽は記憶には触れず、カメラや強い神通には効かないこともある。</p>
<p><b>現代の身分。</b>九人は皆、合法の身分と職歴を持つ。不老長生は、長い周期で身分を替え、事業を引き継ぐことでやりくりしている。長く付き合う人間たちはたいてい、彼らが同じ古い一族の出だとしか知らない。</p>
<p><b>鎮瀾院の位置づけ。</b>人ならざる者の世界で、鎮瀾院は龍契に守られた古い宗門の本拠にすぎず、彼らの社会の首都ではない。人ならざる客は身分と用件を告げねばならず、何伯が記帳する。どんな客も屋敷内で大規模な幻術、闘法、封印破りをしてはならない。九人の友人も例外ではない。</p>
<p>以下の体長はすべて原身を収めたときの大きさで、神通を使うときには霊相がさらに大きくなる。九人は祖堂と裏山で完全に原身に戻ってはならない。前回誰かがそうしたとき、祖堂の梁を一本替えることになった。</p>
${slp('顧昭衡','#2f5079','「皆が善でも皆が悪でもない」――八、この一文の適用範囲を明記してくれ。')}`},
 ch4:{no:'第 四 章',h:'鎮瀾院',narr:['明日、君は前庭の青レンガの門楼から入ってくる。','正庁を抜けると中庭。古木と石畳と回廊。おやつも喧嘩も日向ぼっこも、みんなそこで。','東院は大兄さんの琴室。彼の琴には触らないこと。','裏山のいちばん高いところが観風台。三兄さんはたいていそこにいて、木には風鈴がいくつか掛かっている。'],
  scenes:[['中庭','毎年誰かが春聯が曲がっていると言う。'],['東院の琴室','古琴の隣にシンセサイザーが一台。'],['観風台','裏山の頂、楼閣の前の石の台。']],
  sum:'細目・鎮瀾院全図、部屋割りと屋敷の決まり',
  intro:'<p>鎮瀾院は新界・元朗の錦田、人里離れた山裾にあり、私道で錦田の市街とつながっている。外は古く、住めば現代的。初代龍契が残した地下の石壇と鎮水の礎、古代の祖堂・碑廊・蔵書楼、明清以降の青レンガの母屋と中庭と塀、二十世紀に足した台所と宿舎、そして現代に足したスイート、エレベーター、空調、車庫、ネット、警備。測るたびに長さの違う廊下が一本ある。</p>',
  rules:`<h3>屋敷の決まり</h3><ul><li>私室は同意を得てから入ること。</li><li>祖堂は共同の祭祀の場。個人の供奉はそれぞれの部屋でもよい。</li><li>裏山は掘り返さないこと。散歩はかまわない。</li><li>三十日のあいだはこの屋敷が住まい。日中の出入りは自由。</li><li>十人の部屋割りは択主と関係ない。主奉に選ばれても宗主の部屋へ移ることはない。</li></ul>
${slp('白懐石','#5e9c90','西院の床は俺が張り替えた。二回。')}${slp('岑帰岫','#8f6a3c','観風台には扉がないから鍵は探さなくていい。登るときは水を持ってきて。',1)}`},
 ch5:{no:'第 五 章',h:'三十日',narr:['この三十日は静かじゃない。','二日には一族が年始参りに来て、盆菜が卓を埋める。三日は赤口なのに、老鰲はよりによってこの日に来て罵る。四日から六日には、人ではない古い友人たちが贈り物を持ってやって来る。','十五日の元宵には、蘭鏡台が中庭に数百年前の灯籠をともしてくれる。']},
 ch6:{no:'第 六 章',h:'屋敷の九つの品',narr:['長く暮らせば気づくはず。この屋敷には、誰も触れたがらない物がある。','弦の切れた琴、ひびの入った古い鐘、古い集合写真……どれにも来歴がある。','!「ねえ君、来歴なんてものはね、本当に聞きたくなったら、自然と誰かが話してくれるよ。」'],sum:'細目・所蔵品の登記',anyu:'この巻は品名、保管場所、取扱いのみを記す。それ以外は載せない。'},
 epi:{no:'終　章',h:'夜が明ける',narr:['窓の外の空が、一枚ぶん淡くなった。','!「帰る前に、貸出カードに名前を書いていって。」','彼はカードを押しやる。「兄弟たちの貸出記録は見てもいいよ。真似はしないでね。」']},
 secret:{warn:'これは目録に載せなかった私的な記録で、九人の昔の出来事が書かれています。<br>読めば、彼らが自分の口からは話していないことを知ることになります。',open:'それでも開く',h:'目録外',sub:'容観復の私録',
  intro:'君、ここまで辿り着いたんだね。なら、ありのままに書こう。以下の当事者はみな生きていて、みなまだこの屋敷に住んでいる。彼らがあの頃のことをどう思っているかは彼らのこと。僕は何があったかだけを記す。',
  items:[
   ['附・存壹　断弦の古琴','晏清徴','<p>数百年前、ある城が邪な音に惑わされた。大兄さんは琴の音で城じゅうの音を封じた。災いは収まったが、城の多くの人はそれきり音を聞けなくなった。琴の内側にはその城の古い名が刻まれている。彼は否定もせず、赦しも求めない。あのときほかに方法はなかった、とだけ言う。必要とあらば、彼はまたそうするだろうと僕は思う。</p>'],
   ['附・存貳　睚眦の禁令','霍無咎','<p>二兄さんが庇護していた人々が罠にかけられて殺された。彼は企みに加わった一族を根こそぎにし、幼い者も、何も知らない子孫も見逃さなかった。当代の宗主が龍契に基づいて求め、七兄さんが出てようやく止まった。禁令はその後にできた。私怨に無関係の者を巻き込んではならない。彼は赦しが要るとは思っていない。後悔しているかと聞けば、たぶん、あの野郎を三日余計に生かしたことだけ後悔している、と言うだろう。</p>'],
   ['附・存參　古い集合写真','岑帰岫','<p>数百年前、ある継承者が三兄さんを主奉に選んだ。二人で旅をしていたとき、彼はある一行が自分たちだけで山に入るのを放っておき、山崩れのあと生きて戻ったのは半分にも満たなかった。二人はそのことで言い争い、しばらく離れたが、やがて仲直りし、その人は彼に寄り添われて生涯を終えた。六兄さんは駆けつけたが、残った山を押さえるのがやっとだった。アルバム棚のあの写真は、何年も経ってから作り直したものだ。</p>'],
   ['附・存肆　古鐘のひび','祝鳴珂','<p>四兄さんは若い頃、面白半分に天災が来るときの龍鳴を真似た。ある町が恐慌に陥って人々が押し合い、死傷者が出た。当代の宗主は死傷者名簿を彼の前に投げ出し、一人ずつ名前を読み上げさせた。鐘のひびは、そのとき無理やり彼を止めたときについたものだ。それ以来、彼はどの遊びが人を殺すかを見分けられるようになった。そのうえで、相変わらず性格が悪い。</p>'],
   ['附・存伍　庇護の城の旧家','梁玄度','<p>動乱の時代、五兄さんは大勢の民を引き取った。一つの城を守るために、出入り口をすべて封じた。民は戦火を免れ、同時に出ていく自由を失った。ある代の宗主は「人を養っているのではない、籠を養っているのだ」と言い、彼は「籠の外では、あのとき人が死んでいた」と答えた。山の上の屋敷はそのときの避難所から生まれたもので、あの旧家たちは今も彼を頼っている。彼は、秩序には代償があると考えている。</p>'],
   ['附・存陸　地底の石碑','白懐石','<p>地脈が裂けたとき、六兄さんは村人が逃げるのを待たずに原身で山を押さえた。村は人ごと地の下に埋まり、そのかわりにほかの町々が助かった。彼が山を押さえていることは秘密ではない。山の下に村があったことが秘密だ。石碑には封じた山の位置と犠牲者の名が刻まれている。彼はすべての名を覚えていて、それでも同じ選択をするだろう。</p>'],
   ['附・存柒　旧審堂の判決文','顧昭衡','<p>七兄さんが深く愛したあの継承者は、生贄にされかけた人々を救うために、宗門と土地の神との付属の神契を密かに書き換えた。人々は救われ、封印は破れた。七兄さんは自ら審理し、律に従って恋人に十年の禁錮を言い渡した。判決文の末尾には彼の自筆の署名がある。彼はあの恋の話をするのを厭わない。裁きの細部は外の者には話さないから、僕もここまでにしておく。</p>'],
   ['附・存捌　書き換えられた史書','容観復','<p>史書を整理していて、敬われている宗門のある祖師が私利のために大勢の無辜の人を犠牲にしていたことを知った。宗門が割れないよう、僕は犠牲者の名を消し、彼の私欲を犠牲へと書き換えた。彼は今も聖賢として祀られている。七兄さんは僕が書き換えたことを知っているが、原本がどこにあるかは知らない。</p><p>原本のありかはね、君、この一条だけは書かない。日の目を見せるかどうかは宗主の決めること。心が決まったら、僕のところへおいで。</p>'],
   ['附・存玖　焼けて歪んだ金の飾り','殷照夜','<p>ある城の権力者が邪術で無辜の人々を生贄にした。城が大火に包まれたあの夜、末っ子は城の外に座って一晩じゅう眺めていた。火が隣の町に及んでようやく動いて火を呑んだが、逃げ遅れた無辜の人々がいた。あの金の飾りは、生き残った人が彼を問い詰めるために送ってきたものだ。</p>']],
  outro:'書き終えた。この一冊は目録にないから、読まなかったことにしてもいい。君が知ったからといって、彼らが別の誰かになるわけじゃない。彼らをどう見るかは、君が決めることだ。'}
};
